<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lucky Heart Casino 🎰</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(circle at center, #2a0845 0%, #11001c 100%);
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; padding: 20px; overflow: hidden;
    color: #fff;
  }

  /* Заголовок и баланс */
  .header { text-align: center; margin-bottom: 30px; }
  h1 { 
    font-size: 2.5rem; text-transform: uppercase; letter-spacing: 3px;
    background: linear-gradient(to right, #ffd700, #ff8c00, #ffd700);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    text-shadow: 0 0 20px rgba(255, 215, 0, 0.3); margin-bottom: 10px;
  }
  
  .balance-box {
    background: rgba(0, 0, 0, 0.5); border: 2px solid #ffd700; border-radius: 30px;
    padding: 10px 30px; display: inline-block; font-size: 1.2rem; font-weight: bold;
    box-shadow: 0 0 15px rgba(255, 215, 0, 0.2);
  }
  .balance-box span { color: #ffd700; margin-left: 10px; font-size: 1.4rem; }

  /* Игровой автомат */
  .slot-machine {
    background: linear-gradient(180deg, #4a0e4e, #1a021a);
    border: 5px solid #ffd700; border-radius: 20px; padding: 30px;
    box-shadow: 0 0 50px rgba(255, 215, 0, 0.2), inset 0 0 20px rgba(0,0,0,0.8);
    position: relative;
  }

  /* Барабаны */
  .reels {
    display: flex; gap: 15px; margin-bottom: 30px;
    background: #000; padding: 15px; border-radius: 15px;
    box-shadow: inset 0 0 20px rgba(255, 215, 0, 0.3);
  }

  .reel {
    width: 100px; height: 120px; background: #fff; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 4rem; user-select: none; overflow: hidden;
    box-shadow: inset 0 -10px 20px rgba(0,0,0,0.2), inset 0 10px 20px rgba(0,0,0,0.2);
    position: relative;
  }

  /* Анимация кручения */
  .reel.spinning { animation: blur 0.1s infinite alternate; }
  @keyframes blur {
    from { filter: blur(0px); transform: translateY(0); }
    to { filter: blur(4px); transform: translateY(5px); }
  }

  /* Выигрышная подсветка */
  .reel.win { 
    background: #fffae6; box-shadow: 0 0 30px #ffd700; border: 2px solid #ffd700;
    animation: pulse 1s infinite alternate;
  }
  @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.05); } }

  /* Кнопки */
  .controls { display: flex; gap: 10px; justify-content: center; }
  
  .btn {
    padding: 15px 40px; border: none; border-radius: 10px; font-size: 1.2rem;
    font-weight: bold; text-transform: uppercase; cursor: pointer; transition: all 0.2s;
    box-shadow: 0 5px 0 rgba(0,0,0,0.5);
  }
  
  .btn-spin {
    background: linear-gradient(135deg, #00b09b, #96c93d); color: #fff;
  }
  .btn-spin:active { transform: translateY(5px); box-shadow: 0 0 0 rgba(0,0,0,0.5); }
  .btn-spin:disabled { opacity: 0.5; cursor: not-allowed; transform: translateY(5px); box-shadow: 0 0 0; }

  .btn-reset { background: #e74c3c; color: #fff; padding: 15px 20px; }

  /* Сообщения */
  .message {
    margin-top: 20px; font-size: 1.4rem; font-weight: bold; text-align: center;
    min-height: 35px; letter-spacing: 1px; text-shadow: 0 0 10px rgba(255,255,255,0.5);
  }
  .win-text { color: #2ecc71; animation: pop 0.5s ease; }
  .lose-text { color: #e74c3c; }
  @keyframes pop { 0% { transform: scale(0.5); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }

  @media (max-width: 480px) {
    h1 { font-size: 1.8rem; }
    .reel { width: 80px; height: 100px; font-size: 3rem; }
    .slot-machine { padding: 20px 15px; }
    .btn { padding: 12px 20px; font-size: 1rem; }
  }
</style>
</head>
<body>

  <div class="header">
    <h1>Lucky Heart Casino</h1>
    <div class="balance-box">
      Монеты: <span id="balance">1000</span>
    </div>
  </div>

  <div class="slot-machine">
    <div class="reels">
      <div class="reel" id="reel1">🍒</div>
      <div class="reel" id="reel2">🍒</div>
      <div class="reel" id="reel3">🍒</div>
    </div>
    
    <div class="controls">
      <button class="btn btn-spin" id="spinBtn">Крутить (100)</button>
      <button class="btn btn-reset" id="resetBtn" title="Сбросить баланс">↻</button>
    </div>
    
    <div class="message" id="message">Испытай удачу!</div>
  </div>

<script>
  // Символы для игры
  const symbols = ['🍒', '🍋', '🔔', '💎', '7️⃣'];
  const reels = [
    document.getElementById('reel1'),
    document.getElementById('reel2'),
    document.getElementById('reel3')
  ];
  
  const balanceEl = document.getElementById('balance');
  const messageEl = document.getElementById('message');
  const spinBtn = document.getElementById('spinBtn');
  const resetBtn = document.getElementById('resetBtn');

  let balance = 1000;
  const bet = 100; // Стоимость одного спина
  let isSpinning = false;

  // Обновление баланса
  function updateBalance() {
    balanceEl.textContent = balance;
    // Меняем цвет, если монет мало
    if (balance < bet) {
      balanceEl.style.color = '#e74c3c';
    } else {
      balanceEl.style.color = '#ffd700';
    }
  }

  // Генерация случайного символа
  function getRandomSymbol() {
    return symbols[Math.floor(Math.random() * symbols.length)];
  }

  // Основная функция игры
  function spin() {
    if (isSpinning) return;
    
    if (balance < bet) {
      messageEl.textContent = "Недостаточно монет! Нажмите ↻";
      messageEl.className = "message lose-text";
      return;
    }

    // Начало игры
    isSpinning = true;
    balance -= bet;
    updateBalance();
    
    spinBtn.disabled = true;
    messageEl.textContent = "Крутим...";
    messageEl.className = "message";

    // Убираем подсветку выигрыша с прошлого раза
    reels.forEach(reel => {
      reel.classList.remove('win');
      reel.classList.add('spinning');
    });

    // Анимация остановки (с задержкой для каждого барабана)
    const results = [getRandomSymbol(), getRandomSymbol(), getRandomSymbol()];

    let stopTime = 500; // Первый барабан остановится через 0.5 сек

    reels.forEach((reel, index) => {
      setTimeout(() => {
        // Быстрая смена картинок, пока барабан крутится
        const interval = setInterval(() => {
          reel.textContent = getRandomSymbol();
        }, 50);

        // Остановка барабана
        setTimeout(() => {
          clearInterval(interval);
          reel.classList.remove('spinning');
          reel.textContent = results[index];
          
          // Если это последний барабан - проверяем результат
          if (index === 2) {
            checkWin(results);
          }
        }, stopTime);

      }, index * 100); // Небольшая задержка старта для каждого барабана
      
      stopTime += 300; // Каждый следующий крутится на 0.3 сек дольше
    });
  }

  // Проверка выигрыша
  function checkWin(results) {
    let winAmount = 0;
    
    // 3 одинаковых
    if (results[0] === results[1] && results[1] === results[2]) {
      switch(results[0]) {
        case '7️⃣': winAmount = bet * 50; break;
        case '💎': winAmount = bet * 20; break;
        case '🔔': winAmount = bet * 10; break;
        default: winAmount = bet * 5; // Ягоды
      }
      
      // Подсветка выигрыша
      reels.forEach(reel => reel.classList.add('win'));
      messageEl.textContent = `🎉 ДЖЕКПОТ! Выигрыш: +${winAmount}`;
      messageEl.className = "message win-text";
      
    // 2 одинаковых
    } else if (results[0] === results[1] || results[1] === results[2] || results[0] === results[2]) {
      winAmount = bet * 2;
      
      // Подсветка совпавших
      if (results[0] === results[1]) { reels[0].classList.add('win'); reels[1].classList.add('win'); }
      if (results[1] === results[2]) { reels[1].classList.add('win'); reels[2].classList.add('win'); }
      if (results[0] === results[2]) { reels[0].classList.add('win'); reels[2].classList.add('win'); }
      
      messageEl.textContent = `✨ Повезло! Выигрыш: +${winAmount}`;
      messageEl.className = "message win-text";
      
    } else {
      messageEl.textContent = "Повезет в следующий раз!";
      messageEl.className = "message lose-text";
    }

    // Начисляем монеты
    balance += winAmount;
    updateBalance();

    // Разблокируем кнопку
    isSpinning = false;
    spinBtn.disabled = false;
  }

  // Обработчики событий
  spinBtn.addEventListener('click', spin);
  
  resetBtn.addEventListener('click', () => {
    if (isSpinning) return;
    balance = 1000;
    updateBalance();
    messageEl.textContent = "Баланс восстановлен!";
    messageEl.className = "message";
    reels.forEach(reel => reel.classList.remove('win'));
  });

  // Инициализация
  updateBalance();
</script>
</body>
</html>
